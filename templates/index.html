<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>localconvert</title>
<style>
:root{--bd:#e5e5e5;--mut:#8a8a8a;--err:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111;background:#fff;max-width:660px;margin:0 auto;padding:48px 20px 90px}
h1{font-size:17px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none}
.sub{color:var(--mut);font-size:13px;margin-bottom:36px}
.cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#b0b0b0;margin:26px 0 10px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.tool{border:1px solid var(--bd);background:#fff;color:#111;padding:9px 16px;font:inherit;font-size:13.5px;cursor:pointer;border-radius:6px;transition:all .12s}
.tool:hover{background:#111;border-color:#111;color:#fff}
#back{font:inherit;font-size:13px;background:none;border:0;color:var(--mut);cursor:pointer;padding:0;margin-bottom:22px}
#back:hover{color:#111}
h2{font-size:21px;font-weight:600;margin:0 0 4px}
.note{font-size:13px;color:var(--mut);margin-bottom:22px;white-space:pre-wrap}
#drop{border:1.5px dashed #d4d4d4;border-radius:8px;padding:34px 20px;text-align:center;color:var(--mut);font-size:13.5px;cursor:pointer;transition:all .12s}
#drop:hover,#drop.over{border-color:#111;color:#111;background:#fafafa}
#drop b{color:#111;font-weight:500}
#files{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:6px;padding:8px 12px;font-size:13px;background:#fff}
.frow .hnd{color:#c4c4c4;cursor:grab}
.frow .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fsize{color:var(--mut);flex:none}
.frow .fx{background:none;border:0;cursor:pointer;color:#c0c0c0;font-size:15px;padding:0 2px;line-height:1}
.frow .fx:hover{color:var(--err)}
#iowrap{margin-top:18px}
#tin,#tout{font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;width:100%;min-height:150px;border:1px solid var(--bd);border-radius:6px;padding:10px;resize:vertical;background:#fff;color:#111}
#tin:focus,#tout:focus{outline:none;border-color:#111}
#tout{background:#fafafa}
#opts{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.opt label.olab{display:block;font-size:12px;color:#666;margin-bottom:5px}
.opt input[type=text],.opt select{font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--bd);border-radius:6px;width:100%;max-width:320px;background:#fff;color:#111;transition:border-color .12s}
.opt input[type=text]:focus,.opt select:focus{outline:none;border-color:#111}
.opt input::placeholder{color:#c4c4c4}
.opt .ck{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#333;cursor:pointer}
.opt .ck input{width:15px;height:15px;accent-color:#111}
#loadfile{font:inherit;font-size:12.5px;background:#fff;border:1px solid var(--bd);border-radius:5px;padding:3px 10px;cursor:pointer;color:#555;margin-bottom:8px}
#loadfile:hover{border-color:#111;color:#111}
#outwrap{margin-top:16px}
.olab2{font-size:12px;color:#666;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
#copybtn{font:inherit;font-size:12px;border:1px solid var(--bd);background:#fff;border-radius:5px;padding:3px 10px;cursor:pointer}
#copybtn:hover{border-color:#111}
#statsbox{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.stat .sv{font-size:17px;font-weight:600;word-break:break-all}
.stat .sl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
#cropwrap{margin-top:16px}
#ccanvas{border:1px solid var(--bd);border-radius:6px;max-width:100%;cursor:crosshair;display:block}
.chint{font-size:12px;color:var(--mut);margin-top:6px}
#previewwrap{margin-top:16px}
#pimg{max-width:100%;border:1px solid var(--bd);border-radius:6px;display:block}
#pdl{display:inline-block;margin-top:8px;font-size:13px;color:#111}
#colorwrap{margin-top:18px;display:flex;flex-direction:column;gap:12px}
#colorwrap .crow{display:flex;align-items:center;gap:10px}
#colorwrap label{font-size:12px;color:#666;width:38px;flex:none}
#colorwrap input{font:13px ui-monospace,Menlo,Consolas,monospace;padding:8px 11px;border:1px solid var(--bd);border-radius:6px;width:240px;background:#fff;color:#111}
#colorwrap input:focus{outline:none;border-color:#111}
#swatch{width:42px;height:42px;border:1px solid var(--bd);border-radius:6px;flex:none}
#run{margin-top:24px;font:inherit;font-size:14px;font-weight:500;background:#111;color:#fff;border:0;border-radius:6px;padding:10px 24px;cursor:pointer;transition:background .12s}
#run:hover:not(:disabled){background:#333}
#run:disabled{background:#d4d4d4;cursor:default}
#barwrap{height:2px;background:#f0f0f0;margin-top:18px;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s}
#barwrap.on{opacity:1}
#bar{height:100%;width:0;background:#111;transition:width .15s}
#status{margin-top:10px;font-size:13px;color:#555;min-height:18px;white-space:pre-wrap;word-break:break-all}
#status.err{color:var(--err)}
#status.ok{color:var(--ok)}
footer{margin-top:64px;font-size:12px;color:#c0c0c0;text-align:center}
</style></head><body>

<div id="home">
  <h1><span class="dot"></span>localconvert</h1>
  <div class="sub" id="subtitle"></div>
  <div id="tools"></div>
</div>

<div id="toolview" hidden>
  <button id="back">&larr; all tools</button>
  <h2 id="ttitle"></h2>
  <div class="note" id="tnote"></div>

  <div id="drop">drop file here or <b>click to browse</b></div>
  <input type="file" id="file" hidden>
  <div id="files"></div>

  <div id="cropwrap" hidden>
    <canvas id="ccanvas"></canvas>
    <div class="chint">drag a box on the image, or type exact pixel values below</div>
  </div>

  <div id="iowrap" hidden>
    <button id="loadfile" hidden>load from file...</button>
    <input type="file" id="tinfile" hidden>
    <textarea id="tin" spellcheck="false" placeholder="paste or type text here"></textarea>
  </div>

  <div id="opts"></div>
  <button id="run">run</button>
  <div id="barwrap"><div id="bar"></div></div>

  <div id="outwrap" hidden>
    <div class="olab2"><span>output</span><button id="copybtn">copy</button></div>
    <textarea id="tout" readonly spellcheck="false"></textarea>
  </div>

  <div id="statsbox" hidden></div>

  <div id="previewwrap" hidden>
    <img id="pimg" alt="">
    <a id="pdl" href="#">download image</a>
  </div>

  <div id="colorwrap" hidden>
    <div class="crow"><label>HEX</label><input id="chex" placeholder="#4f8cff"><div id="swatch"></div></div>
    <div class="crow"><label>RGB</label><input id="crgb" placeholder="79, 140, 255"></div>
    <div class="crow"><label>HSL</label><input id="chsl" placeholder="217, 100%, 65%"></div>
  </div>

  <div id="status"></div>
</div>

<footer>files never leave this machine</footer>

  else for(const f of list)if(!picked.some(x=>x.name===f.name&&x.size===f.size))picked.push(f);
  if(cur==="img-crop")loadCrop(picked[0]);

    if(T[cur].reorder){
      const h=document.createElement("span");h.className="hnd";h.textContent="::";h.title="drag to reorder";row.appendChild(h);
      row.draggable=true;

      row.ondrop=e=>{e.preventDefault();if(dragIdx===null||dragIdx===i)return;const [m]=picked.splice(dragIdx,1);picked.splice(i,0,m);dragIdx=null;renderFiles();};
    }

function formData(t){
  const fd=new FormData();
  fd.append("tool",cur);
  for(const f of picked)fd.append("files",f);
  for(const o of t.o||[]){const el=$("o_"+o.k);if(!el)continue;
    if(o.t==="c"){if(el.checked)fd.append(o.k,"1");}
    else if(el.value!=="")fd.append(o.k,el.value);}
  for(const k in (t.send||{}))fd.append(k,t.send[k]);
  return fd;
}
function runServer(t){
  const fd=formData(t);
  runEl.disabled=true;setStatus("uploading...");setBar(0);
  const x=new XMLHttpRequest();
  x.open("POST","/process");x.responseType="blob";
  x.upload.onprogress=e=>{if(e.lengthComputable){setBar(Math.round(e.loaded/e.total*100));setStatus("uploading "+Math.round(e.loaded/e.total*100)+"%");}};
  x.upload.onload=()=>setStatus("working...");
  x.onprogress=e=>{if(e.lengthComputable&&e.loaded<e.total){setBar(Math.round(e.loaded/e.total*100));setStatus("downloading "+Math.round(e.loaded/e.total*100)+"%");}};
  x.onload=()=>{
    runEl.disabled=picked.length===0;setBar(null);
    if(x.status===200){
      const m=(x.getResponseHeader("Content-Disposition")||"").match(/filename="?([^"]+)"?/);
      const name=m?m[1]:"download";
      dl(x.response,name);
      let s="done -> "+name+" ("+fmtMB(x.response.size)+")";
      if(picked.length===1&&x.response.size<picked[0].size){
        const save=Math.round((1-x.response.size/picked[0].size)*100);
        if(save>0)s+="  |  "+fmtMB(picked[0].size)+" -> "+fmtMB(x.response.size)+" (-"+save+"%)";
      }
      setStatus(s,"ok");
    }else{
      x.response.text().then(txt=>{let msg="failed";try{msg=JSON.parse(txt).error||msg;}catch(e){}setStatus(msg,"err");});
    }
  };
  x.onerror=()=>{runEl.disabled=false;setBar(null);setStatus("connection failed - is the server running?","err");};
  x.send(fd);
}
async function runReport(t){
  runEl.disabled=true;setStatus("counting...");
  try{
    const r=await fetch("/process",{method:"POST",body:formData(t)});
    const j=await r.json();
    if(j.report){
      let s=j.report.files.map(f=>f.name+": "+f.pages+" pages").join("\n");
      s+="\n--------\nTOTAL: "+j.report.total+" pages";
      setStatus(s,"ok");
    }else setStatus(j.error||"failed","err");
  }catch(e){setStatus("connection failed","err");}
  runEl.disabled=false;
}

function parseJSON(t){try{return JSON.parse(t);}catch(e){throw new Error(jsonErr(t,e));}}
function jsonErr(txt,e){
  const m=/position (\d+)/.exec(e.message);if(!m)return e.message;
  const pos=+m[1],up=txt.slice(0,pos),ln=up.split("\n").length,col=pos-up.lastIndexOf("\n");
  return "line "+ln+", col "+col+" - "+e.message;
}
function b64encUTF8(s){const b=new TextEncoder().encode(s);let bin="";const CH=0x8000;
  for(let i=0;i<b.length;i+=CH)bin+=String.fromCharCode.apply(null,b.subarray(i,i+CH));return btoa(bin);}
function b64decUTF8(s){const bin=atob(s.replace(/\s+/g,""));const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(b);}
function csvParse(text,d){
  const rows=[];let row=[],cur2="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur2+='"';i++;}else q=false;}else cur2+=ch;}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur2);cur2="";}
    else if(ch==="\n"){row.push(cur2);rows.push(row);row=[];cur2="";}
    else if(ch!=="\r")cur2+=ch;}
  if(cur2!==""||row.length){row.push(cur2);rows.push(row);}
  return rows;
}
const FN={
 "case-converter":(t,o)=>{
   if(o.mode==="upper")return t.toUpperCase();
   if(o.mode==="lower")return t.toLowerCase();
   if(o.mode==="title")return t.toLowerCase().replace(/\p{L}+/gu,w=>w[0].toUpperCase()+w.slice(1));
   return t.toLowerCase().replace(/(^\s*\p{L})|([.!?]\s+\p{L})/gu,m=>m.toUpperCase());},
 "remove-duplicates":t=>{const seen=new Set(),out=[];for(const l of t.split("\n")){if(!seen.has(l)){seen.add(l);out.push(l);}}return out.join("\n");},
 "sort-lines":(t,o)=>{const ls=t.split("\n");
   if(o.order==="az")ls.sort((a,b)=>a.localeCompare(b));
   else if(o.order==="za")ls.sort((a,b)=>b.localeCompare(a));
   else if(o.order==="num")ls.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   else ls.sort((a,b)=>a.length-b.length);
   return ls.join("\n");},
 "remove-spaces":(t,o)=>{let s=t;
   if(o.collapse)s=s.replace(/[ \t]+/g," ");
   if(o.trim)s=s.split("\n").map(l=>l.trim()).join("\n");
   if(o.empty)s=s.replace(/\n\s*\n+/g,"\n").replace(/^\n+|\n+$/g,"");
   return s;},
 "find-replace":(t,o)=>{
   if(!o.find)return t;
   let flags="g";if(!o.case)flags+="i";
   let pat=o.find;
   if(!o.regex)pat=pat.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
   if(o.whole)pat="\\b(?:"+pat+")\\b";
   try{return t.replace(new RegExp(pat,flags),o.replace||"");}
   catch(e){throw new Error("bad regex: "+e.message);}},
 "json-format":(t,o)=>JSON.stringify(parseJSON(t),null,o.indent==="tab"?"\t":+o.indent),
 "json-minify":t=>JSON.stringify(parseJSON(t)),
 "json-validate":t=>{const v=parseJSON(t);const type=Array.isArray(v)?"array":typeof v;return "valid JSON - top-level "+type;},
 "csv-to-json":(t,o)=>{
   let d=o.delim;
   if(d==="auto"){const l1=t.split("\n")[0]||"";const c=(l1.match(/,/g)||[]).length,sc=(l1.match(/;/g)||[]).length,tb=(l1.match(/\t/g)||[]).length;d=Math.max(c,sc,tb)===c?",":Math.max(c,sc,tb)===sc?";":"\t";}
   if(d==="tab")d="\t";
   const rows=csvParse(t,d);
   if(!rows.length)return "[]";
   const head=o.header?rows[0]:rows[0].map((_,i)=>"col"+(i+1));
   const body=o.header?rows.slice(1):rows;
   return JSON.stringify(body.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]!==undefined?r[i]:""]))),null,2);},
 "json-to-csv":t=>{
   const arr=parseJSON(t);
   if(!Array.isArray(arr)||!arr.some(x=>typeof x==="object"&&x))throw new Error("expected a JSON array of objects");
   const keys=[];
   for(const r of arr)if(r&&typeof r==="object")for(const k of Object.keys(r))if(!keys.includes(k))keys.push(k);
   const esc=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
   return [keys.join(","),...arr.map(r=>keys.map(k=>esc(r&&r[k])).join(","))].join("\n");},
 "url-encode-decode":(t,o)=>{
   if(o.dir==="encode")return o.mode==="component"?encodeURIComponent(t):encodeURI(t);
   try{return decodeURIComponent(t);}catch(e){throw new Error("invalid percent-encoding");}},
 "base64-text":(t,o)=>o.dir==="encode"?b64encUTF8(t):(()=>{try{return b64decUTF8(t);}catch(e){throw new Error("not valid base64");}})()
};
const STATS={
 "word-counter":t=>{const w=t.match(/\S+/g)||[];const s=(t.match(/[^.!?]+[.!?]+/g)||[]).length;
   const p=t.split(/\n\s*\n/).filter(x=>x.trim()).length;
   return [["words",w.length],["characters",t.length],["sentences",s],["paragraphs",p],["reading time",Math.max(t.trim()?1:0,Math.round(w.length/200))+" min"]];},
 "character-counter":t=>{const lines=t?t.split("\n").length:0;
   return [["characters",t.length],["without spaces",t.replace(/\s/g,"").length],["words",(t.match(/\S+/g)||[]).length],["lines",lines]];}
};
STATS["text-stats"]=t=>{
  const w=t.match(/\S+/g)||[];
  const ss=t.split(/[.!?]+/).filter(x=>x.trim());
  const freq={};
  for(const x of w){const k=x.toLowerCase().replace(/[^\p{L}\p{N}']/gu,"");if(k.length>2)freq[k]=(freq[k]||0)+1;}
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>k+" ("+v+")").join(", ")||"-";
  return [["words",w.length],["avg word length",w.length?(w.join("").length/w.length).toFixed(1):"0"],
    ["sentences",ss.length],["avg sentence length",ss.length?(w.length/ss.length).toFixed(1):"0"],
    ["top words",top],["reading time",Math.max(w.length?1:0,Math.round(w.length/200))+" min"],
    ["speaking time",Math.max(w.length?1:0,Math.round(w.length/130))+" min"]];};

const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
function genUuids(o){
  const n=Math.max(1,Math.min(500,+o.count||5)),out=[];
  for(let i=0;i<n;i++){
    let id=crypto.randomUUID?crypto.randomUUID():
      "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=rnd(16);return (c==="x"?r:(r&3|8)).toString(16);});
    if(o.nohyph)id=id.replace(/-/g,"");
    if(o.upper)id=id.toUpperCase();
    out.push(id);
  }
  return out.join("\n");
}
function genPass(o){
  const len=Math.max(4,Math.min(128,+o.length||16));
  let pools=["abcdefghijkmnopqrstuvwxyz","ABCDEFGHJKLMNPQRSTUVWXYZ","23456789","!@#$%^&*()-_=+[]{};:,.<>?"];
  if(!o.symbols)pools.pop();
  if(!o.digits)pools[2]="";
  if(o.ambiguous){pools[0]+="l";pools[1]+="IO";pools[2]+="01";}
  pools=pools.filter(p=>p.length);
  if(!pools.length)throw new Error("select at least one character set");
  const all=pools.join("");
  const chars=pools.map(p=>p[rnd(p.length)]);
  while(chars.length<len)chars.push(all[rnd(all.length)]);
  for(let i=chars.length-1;i>0;i--){const j=rnd(i+1);[chars[i],chars[j]]=[chars[j],chars[i]];}
  return chars.slice(0,len).join("");
}

let cimg=null,cscale=1,crect=null,cdrag=null;
function loadCrop(file){
  if(!file)return;
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
    cimg=im;
    cscale=Math.min(1,520/im.naturalWidth);
    ccanvas.width=Math.round(im.naturalWidth*cscale);
    ccanvas.height=Math.round(im.naturalHeight*cscale);
    crect=null;drawCrop();
  };
  im.src=u;
}
function drawCrop(){
  const ctx=ccanvas.getContext("2d");
  ctx.clearRect(0,0,ccanvas.width,ccanvas.height);
  if(cimg)ctx.drawImage(cimg,0,0,ccanvas.width,ccanvas.height);
  if(crect){
    ctx.save();ctx.strokeStyle="#111";ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
    ctx.strokeRect(crect.x,crect.y,crect.w,crect.h);ctx.restore();
  }
}
function cpos(e){const r=ccanvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
ccanvas.addEventListener("mousedown",e=>{const p=cpos(e);cdrag={x0:p.x,y0:p.y};});
ccanvas.addEventListener("mousemove",e=>{
  if(!cdrag)return;const p=cpos(e);
  crect={x:Math.min(cdrag.x0,p.x),y:Math.min(cdrag.y0,p.y),
         w:Math.abs(p.x-cdrag.x0),h:Math.abs(p.y-cdrag.y0)};
  drawCrop();
});
window.addEventListener("mouseup",()=>{
  if(!cdrag)return;cdrag=null;
  if(crect&&crect.w>2){
    const set=(k,v)=>{const el=$("o_"+k);if(el)el.value=Math.max(0,Math.round(v));};
    set("x",crect.x/cscale);set("y",crect.y/cscale);
    set("w",crect.w/cscale);set("h",crect.h/cscale);
  }
});
function cropInputsToRect(){
  if(!cimg)return;
  const v=k=>+(( $("o_"+k)||{}).value||0);
  const x=v("x")*cscale,y=v("y")*cscale,w=v("w")*cscale,h=v("h")*cscale;
  if(w>0&&h>0)crect={x,y,w,h};else crect=null;
  drawCrop();
}
function runCrop(){
  if(!cimg)return setStatus("choose an image first","err");
  cropInputsToRect();
  if(!crect||crect.w<1)return setStatus("set the crop area - drag on the image or type values","err");
  const o=optVals(T[cur]);
  let x=Math.round(+o.x||0),y=Math.round(+o.y||0),w=Math.round(+o.w||0),h=Math.round(+o.h||0);
  const W=cimg.naturalWidth,H=cimg.naturalHeight;
  x=Math.max(0,Math.min(x,W-1));y=Math.max(0,Math.min(y,H-1));
  w=Math.max(1,Math.min(w,W-x));h=Math.max(1,Math.min(h,H-y));
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;
  cv.getContext("2d").drawImage(cimg,x,y,w,h,0,0,w,h);
  const f=picked[0]||{name:"image"};
  const ext=(f.name.split(".").pop()||"png").toLowerCase();
  const mime=(ext==="jpg"||ext==="jpeg")?"image/jpeg":ext==="webp"?"image/webp":"image/png";
  const outExt=mime==="image/jpeg"?"jpg":mime==="image/webp"?"webp":"png";
  const base=f.name.replace(/\.[^.]+$/,"");
  cv.toBlob(b=>{dl(b,base+"_crop."+outExt);setStatus("done - cropped "+w+"x"+h+" px","ok");},mime,0.92);
}

const chex=$("chex"),crgb=$("crgb"),chsl=$("chsl"),swatch=$("swatch");
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}h*=60;}
  return [Math.round(h),Math.round(s*100),Math.round(l*100)];
}
function hslToRgb(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}
function setFromColor(which){
  const v=$("c"+which).value;let rgb=null;
  if(which==="hex"){const m=/^#?([0-9a-f]{6})$/i.exec(v.trim());if(m){const n=parseInt(m[1],16);rgb=[n>>16,(n>>8)&255,n&255];}}
  else if(which==="rgb"){const m=v.match(/\d+/g);if(m&&m.length>=3){rgb=m.slice(0,3).map(Number);if(rgb.some(x=>x>255))rgb=null;}}
  else{const m=v.match(/\d+/g);if(m&&m.length>=3){const h=+m[0]%360;let s=+m[1],l=+m[2];if(s>1)s/=100;if(l>1)l/=100;rgb=hslToRgb(h,s,l);}}
  if(!rgb)return;
  chex.value="#"+rgb.map(x=>x.toString(16).padStart(2,"0")).join("");
  crgb.value=rgb.join(", ");
  chsl.value=rgbToHsl(rgb[0],rgb[1],rgb[2]).join(", ");
  swatch.style.background=chex.value;
}
["hex","rgb","hsl"].forEach(w=>$("c"+w).addEventListener("input",()=>setFromColor(w)));

runEl.onclick=()=>{
  const t=T[cur];
  if(t.report)return runReport(t);
  if(t.client==="gen")return runGen(t);
  if(t.client==="b64out")return runB64out(t);
  if(t.client==="b64in")return runB64in();
  if(t.client==="crop")return runCrop();
  return runServer(t);
};
